<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXIF Watermark Generator by Kyuziera</title>
    <link rel="stylesheet" href="x.css" />
    <link rel="stylesheet" href="x-3.css" />
  </head>
  <body>
    <div class="container">
      <div class="preview-area">
        <div id="frameContainer" class="frame-container hidden">
          <canvas id="previewCanvas"></canvas>
          <img id="tempImageHolder" style="display: none" src="" alt="" />
        </div>
        <div id="frameContainerArray" class="hidden"></div>

        <p id="placeholderText">Silakan unggah foto Anda...</p>
      </div>

      <div id="errorValue"></div>

      <div class="controls">
        <div class="control-group-7">
          <div class="custom-select-container">
            <div id="selectedOption" class="selected-display">Pilih Font</div>
            <ul id="optionsList" class="options-list hidden">
              <li
                onclick="selectFont('Arial', `Arial, sans-serif`)"
                style="font-family: Arial, sans-serif"
              >
                Arial (Default)
              </li>
              <li
                onclick="selectFont('Minecraft', `'Minecraft', sans-serif`)"
                style="font-family: &quot;Minecraft&quot;, sans-serif"
              >
                Minecraft
              </li>
              <li
                onclick="selectFont('Orbitron', `'Orbitron', sans-serif`)"
                style="font-family: &quot;Orbitron&quot;, sans-serif"
              >
                Orbitron
              </li>
              <li
                onclick="
                  selectFont('Pixelify Sans', `'Pixelify Sans', sans-serif`)
                "
                style="font-family: &quot;Pixelify Sans&quot;, sans-serif"
              >
                Pixelify Sans
              </li>
              <li
                onclick="
                  selectFont(
                    'Roboto Condensed',
                    `'Roboto Condensed', sans-serif`,
                  )
                "
                style="font-family: &quot;Roboto Condensed&quot;, sans-serif"
              >
                Roboto Condensed
              </li>
              <li
                onclick="selectFont('Roboto Mono', `'Roboto Mono', sans-serif`)"
                style="font-family: &quot;Roboto Mono&quot;, sans-serif"
              >
                Roboto Mono
              </li>
              <li
                onclick="
                  selectFont('Rubik 80s Fade', `'Rubik 80s Fade', sans-serif`)
                "
                style="font-family: &quot;Rubik 80s Fade&quot;, sans-serif"
              >
                Rubik 80s Fade
              </li>
              <li
                onclick="selectFont('Share Tech', `'Share Tech', sans-serif`)"
                style="font-family: &quot;Share Tech&quot;, sans-serif"
              >
                Share Tech
              </li>
              <li
                onclick="
                  selectFont('Sirin Stencil', `'Sirin Stencil', sans-serif`)
                "
                style="font-family: &quot;Sirin Stencil&quot;, sans-serif"
              >
                Sirin Stencil
              </li>
              <li
                onclick="
                  selectFont(
                    'Stack Sans Notch',
                    `'Stack Sans Notch', sans-serif`,
                  )
                "
                style="font-family: &quot;Stack Sans Notch&quot;, sans-serif"
              >
                Stack Sans Notch
              </li>
              <li
                onclick="selectFont('Tiny5', `'Tiny5', sans-serif`)"
                style="font-family: &quot;Tiny5&quot;, sans-serif"
              >
                Tiny5
              </li>
              <li
                onclick="selectFont('Urbanist', `'Urbanist', sans-serif`)"
                style="font-family: &quot;Urbanist&quot;, sans-serif"
              >
                Urbanist
              </li>
            </ul>
          </div>

          <button id="applyManual" type="button" class="upload-button" disabled>
            Apply
          </button>

          <div class="custom-upload-wrap">
            <input type="file" id="wmUpload" accept="image/*" />
            <button id="wmManual" type="button" class="upload-button">
              WM
            </button>
          </div>

          <div class="custom-upload-wrap">
            <input
              type="file"
              id="imageUpload"
              accept="image/jpeg, image/png"
              multiple
            />
            <button type="button" class="upload-button" id="upload-label">
              File
            </button>
          </div>
        </div>

        <div class="control-group-8">
          <input type="range" id="wmSize" min="0" max="100" value="0" />
          <div id="wmSizeValue" class="valueDiv">0</div>
        </div>

        <div class="control-group-4">
          <div>
            <label class="slider-label">Device:</label>
            <input
              type="text"
              id="manual-device"
              placeholder="Xiaomi Mi Note 10 Pro"
              disabled
            />
          </div>
          <div>
            <label class="slider-label">Resolusi</label>
            <input
              type="text"
              id="manual-resolution"
              placeholder="27.1 MP"
              disabled
            />
          </div>
        </div>
        <br />
        <div class="control-group-9">
          <input
            type="text"
            id="manual-aperture"
            placeholder="Apperture"
            disabled
          />
          <input
            type="text"
            id="manual-shutter-speed"
            placeholder="Shutter-Speed"
            disabled
          />
          <input type="text" id="manual-iso" placeholder="ISO" disabled />
        </div>
        <br />
        <div class="control-group-4">
          <input
            type="text"
            id="manual-focal-actual"
            placeholder="Focal-Length"
            disabled
          />
          <input
            type="text"
            id="manual-focal-eq"
            placeholder="FL Equivalent"`
            disabled
          />
        </div>

        <br />
        <input
          type="text"
          id="manual-description"
          placeholder="Description"
          disabled
        />
        <br />
        <br />

        <div class="color-templates">
          <button
            onclick="customInput(0)"
            id="customButton"
            class="custom-class off"
          >
            Off
          </button>
          <button
            onclick="customInput(1)"
            id="customButton"
            class="custom-class"
          >
            C1
          </button>
          <button
            onclick="customInput(2)"
            id="customButton"
            class="custom-class"
          >
            C2
          </button>
          <button
            onclick="customInput(3)"
            id="customButton"
            class="custom-class"
          >
            C3
          </button>
          <button
            onclick="customInput(4)"
            id="customButton"
            class="custom-class"
          >
            C4
          </button>
          <button
            onclick="customInput(5)"
            id="customButton"
            class="custom-class"
          >
            C5
          </button>
          <button
            onclick="customInput(6)"
            id="customButton"
            class="custom-class"
          >
            C6
          </button>
          <button
            onclick="customInput(7)"
            id="customButton"
            class="custom-class"
          >
            C7
          </button>
        </div>

        <div id="advancedControls" class="hidden-controls">
          <div class="control-group-4">
            <select id="frameRatioSelect">
              <option value="1:1">1:1</option>
              <option value="5:4">5:4</option>
              <option value="1.41:1">1.41:1</option>
              <option value="4:3">4:3</option>
              <option value="7:5">7:5</option>
              <option value="3:2">3:2</option>
              <option value="16:10">16:10</option>
              <option value="16:9">16:9</option>
              <option value="18:9">18:9</option>
              <option value="19.5:9">19.5:9</option>
              <option value="1.85:1">1.85:1</option>
              <option value="21:9">21:9</option>
              <option value="2.35:1">2.35:1</option>
              <option value="original" selected>Rasio</option>
            </select>

            <select id="frameOrientation">
              <option value="horizontal">Horizontal</option>
              <option value="vertikal" selected>Vertikal</option>
            </select>
          </div>

          <div class="control-group">
            <div class="control-group-8">
              <input
                type="range"
                id="paddingSlider"
                min="0"
                max="50"
                value="0"
                step="0.5"
              />
              <div id="paddingValueDiv" class="valueDiv">10%</div>
            </div>

            <div class="color-templates">
              <div
                class="color-swatch"
                style="background-color: #ffffff"
                data-color="#FFFFFF"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #d7dee0"
                data-color="#d7dee0"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #bee3e7"
                data-color="#bee3e7"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #96fcd6"
                data-color="#96fcd6"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #dafd81"
                data-color="#dafd81"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #ffd3d2"
                data-color="#ffd3d2"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #f2b0ff"
                data-color="#f2b0ff"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #f5f5dc"
                data-color="#F5F5DC"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #ffcd6f"
                data-color="#FFCD6F"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #face28"
                data-color="#FACE28"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #fb8927"
                data-color="#fb8927"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #e17055"
                data-color="#e17055"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #e84118"
                data-color="#e84118"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #d63031"
                data-color="#d63031"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #c23616"
                data-color="#c23616"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #87f56e"
                data-color="#87f56e"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #00b894"
                data-color="#00b894"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #81ecec"
                data-color="#81ecec"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #74b9ff"
                data-color="#74b9ff"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #6ab7fe"
                data-color="#6ab7fe"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #49a6ff"
                data-color="#49a6ff"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #865bff"
                data-color="#865bff"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #b8b2d3"
                data-color="#b8b2d3"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #8aa5d5"
                data-color="#8aa5d5"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #646464"
                data-color="#646464"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #8c7a5c"
                data-color="#8c7a5c"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #7d6555"
                data-color="#7d6555"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #935a4d"
                data-color="#935a4d"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #957579"
                data-color="#957579"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #6a7e83"
                data-color="#6A7E83"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #5d7968"
                data-color="#5D7968"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #5d6780"
                data-color="#5d6780"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #5b576e"
                data-color="#5b576e"
              ></div>
              <div
                class="color-swatch"
                style="background-color: #3d3d3d"
                data-color="#3d3d3d"
              ></div>

              <div
                class="color-swatch"
                style="background-color: #000000"
                data-color="#000000"
              ></div>
            </div>
            <input type="color" id="colorManual" value="#d7dee0" />
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-10">
            <button id="toggleAdvancedButton" class="color-class" disabled>
              Frame
            </button>
            <button id="downloadButton" class="download-class" disabled>
              Simpan
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="y-3.js"></script>
  </body>
</html>
