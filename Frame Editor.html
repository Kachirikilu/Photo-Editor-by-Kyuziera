<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame Editor by Kyuziera</title>
    <link rel="stylesheet" href="x.css" />
    <link rel="stylesheet" href="x-1.css" />
  </head>
  <body>
    <div class="container">
      <div class="preview-area">
        <div id="frameContainer" class="frame-container hidden">
          <div id="imageWrapper" class="image-wrapper">
            <img id="imagePreview" src="" alt="Pratinjau Foto" />
          </div>
        </div>
        <div id="frameContainerArray" class="frame-container-array hidden">
          <div id="imageWrapperArray" class="image-wrapper-array">
            <img id="imagePreviewArray" src="" alt="Pratinjau Foto" />
          </div>
        </div>
        <p id="placeholderText">Silakan unggah foto Anda...</p>
      </div>

      <div class="controls">
        <div class="control-group-2">
          <select id="maxSizeSelect">
            <option value="1920">1920px</option>
            <option value="2048">2048px</option>
            <option value="2560">2560px</option>
            <option value="3840">3840px</option>
            <option value="4096">4096px</option>
            <option value="5120" selected>5120px</option>
            <option value="6016">6016px</option>
            <option value="7680">7680px</option>
            <option value="8192">8192px</option>
            <option value="max">Resolusi</option>
          </select>

          <select id="frameRatioSelect">
            <option value="1:1">1:1</option>
            <option value="5:4">5:4</option>
            <option value="1.41:1">1.41:1</option>
            <option value="4:3">4:3</option>
            <option value="7:5">7:5</option>
            <option value="3:2">3:2</option>
            <option value="16:10">16:10</option>
            <option value="16:9" selected>16:9</option>
            <option value="18:9">18:9</option>
            <option value="19.5:9">19.5:9</option>
            <option value="1.85:1">1.85:1</option>
            <option value="21:9">21:9</option>
            <option value="2.35:1">2.35:1</option>
            <option value="original">Rasio</option>
          </select>

          <select id="frameOrientation">
            <option value="horizontal">Horizontal</option>
            <option value="vertikal" selected>Vertikal</option>
          </select>

          <div class="custom-upload-wrap">
            <input type="file" id="imageUpload" accept="image/*" multiple />
            <button type="button" class="upload-button" id="upload-label">
              File
            </button>
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-8">
            <input
              type="range"
              id="paddingSlider"
              min="0"
              max="50"
              value="5"
              step="0.5"
            />
            <div id="paddingValueDiv" class="valueDiv">10%</div>
          </div>

          <div class="color-templates">
            <button
              onclick="customInput(1)"
              id="customButton"
              class="custom-class"
            >
              C1
            </button>
            <button
              onclick="customInput(2)"
              id="customButton"
              class="custom-class"
            >
              C2
            </button>
            <button
              onclick="customInput(3)"
              id="customButton"
              class="custom-class"
            >
              C3
            </button>
            <button
              onclick="customInput(4)"
              id="customButton"
              class="custom-class"
            >
              C4
            </button>
            <button
              onclick="customInput(5)"
              id="customButton"
              class="custom-class"
            >
              C5
            </button>
            <button
              onclick="customInput(6)"
              id="customButton"
              class="custom-class"
            >
              C6
            </button>
            <button
              onclick="customInput(7)"
              id="customButton"
              class="custom-class"
            >
              C7
            </button>
            <button
              onclick="customInput(8)"
              id="customButton"
              class="custom-class"
            >
              C8
            </button>
          </div>

          <div class="color-templates">
            <div
              class="color-swatch"
              style="background-color: #ffffff"
              data-color="#FFFFFF"
            ></div>
            <div
              class="color-swatch"
              style="background-color: #d7dee0"
              data-color="#d7dee0"
            ></div>
            <div
              class="color-swatch"

            <div

            <div

            <div

            ></div>

            <div
              class="color-swatch"
              style="background-color: #87f56e"

            <div

            ></div>
            <div
              class="color-swatch"

            ></div>

            <div

              style="background-color: #6a7e83"
              data-color="#6A7E83"
            ></div>
            <div
              class="color-swatch"
              style="background-color: #5d7968"
              data-color="#5D7968"
            ></div>
            <div
              class="color-swatch"
              style="background-color: #5d6780"

            <div

            ></div>
            <div
              class="color-swatch"
              style="background-color: #3d3d3d"
              data-color="#3d3d3d"
            ></div>

            <div
              class="color-swatch"
              style="background-color: #000000"
              data-color="#000000"
            ></div>
          </div>
          <input type="color" id="colorManual" value="#d7dee0" />

          <button class="download-class" id="downloadButton" disabled>
            Simpan
          </button>
        </div>
      </div>
    </div>

    <script src="y-1.js"></script>
  </body>
</html>
