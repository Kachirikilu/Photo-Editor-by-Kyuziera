<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixelation Image Processor by Kyuziera</title>
    <link rel="stylesheet" href="x.css" />
    <link rel="stylesheet" href="x-2.css" />
  </head>
  <body>
    <div class="container">
      <div class="preview-area">
        <div id="singleFileContainer">
          <canvas id="displayCanvas" class="hidden"></canvas>
          <p id="placeholderText">Silakan unggah foto Anda...</p>
        </div>
        <div id="multiFileContainer" class="hidden"></div>
      </div>

      <div class="controls">
        <div class="control-group-3">
          <select id="downloadMode">
            <option value="base">Pixelated</option>
            <option value="1920">Max 1920px</option>
            <option value="2048">Max 2048px</option>
            <option value="2560">Max 2560px</option>
            <option value="3840">Max 3840px</option>
            <option value="4096" selected>Max 4096px</option>
            <option value="5120">Max 5120px</option>
            <option value="6016">Max 6016px</option>
            <option value="7680">Max 7680px</option>
            <option value="8192">Max 8192px</option>
            <option value="max">Max Default Resolusi</option>
          </select>

          <button
            onclick="smoothImage()"
            type="button"
            class="smooth-button off"
            id="smoothButton"
          >
            Smooth
          </button>

          <div class="custom-upload-wrap">
            <input type="file" id="fileInput" accept="image/*" multiple />
            <button type="button" class="upload-button" id="uploadLabel">
              File
            </button>
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-4">
            <div>
              <label for="baseSideLength" class="slider-label"
                >Pixelation:
                <span id="baseSideLengthValue" class="value">200</span>
              </label>
              <input
                type="range"
                id="baseSideLength"
                min="25"
                max="500"
                value="200"
                step="5"
              />
            </div>
            <div>
              <label for="colorDepth" class="slider-label"
                >Color Depth:
                <span id="colorDepthValue" class="value">32</span>
              </label>
              <input
                type="range"
                id="colorDepth"
                min="1"
                max="128"
                value="32"
                step="1"
              />
            </div>
          </div>

          <div class="control-group-4">
            <div>
              <label for="ditheringStrength" class="slider-label"
                >Dithering:
                <span id="ditheringStrengthValue" class="value">0.80</span>
              </label>
              <input
                type="range"
                id="ditheringStrength"
                min="0"
                max="1"
                value="0.8"
                step="0.01"
              />
            </div>
            <div>
              <label for="noiseStrength" class="slider-label"
                >Noise:
                <span id="noiseStrengthValue" class="value">0</span>
              </label>
              <input
                type="range"
                id="noiseStrength"
                min="0"
                max="100"
                value="0"
                step="1"
              />
            </div>
          </div>

          <div id="advancedControls" class="hidden-controls">
            <div>
              <label for="lumaForNoise" class="slider-label"
                >Luma Area for Noise:
                <span id="lumaForNoiseValue" class="value">255</span></label
              >
              <input
                type="range"
                id="lumaForNoise"
                min="0"
                max="255"
                value="255"
              />
            </div>
            <div class="control-group-4">
              <div>
                <label for="brightness" class="slider-label"
                  >Brightness:
                  <span id="brightnessValue" class="value">0</span></label
                >
                <input
                  type="range"
                  id="brightness"
                  min="-100"
                  max="100"
                  value="0"
                />
              </div>
              <div>
                <label for="contrast" class="slider-label"
                  >Contrast:
                  <span id="contrastValue" class="value">0</span></label
                >
                <input
                  type="range"
                  id="contrast"
                  min="-50"
                  max="50"
                  value="0"
                />
              </div>
            </div>

            <div class="control-group-4">
              <div>
                <label for="highlight" class="slider-label"
                  >Highlight:
                  <span id="highlightValue" class="value">0</span></label
                >
                <input
                  type="range"
                  id="highlight"
                  min="-50"
                  max="50"
                  value="0"
                />
              </div>
              <div>
                <label for="shadow" class="slider-label"
                  >Shadow: <span id="shadowValue" class="value">0</span></label
                >
                <input type="range" id="shadow" min="-50" max="50" value="0" />
              </div>
            </div>

            <div>
              <label for="saturation" class="slider-label"
                >Saturation:
                <span id="saturationValue" class="value">0</span></label
              >
              <input
                type="range"
                id="saturation"
                min="-100"
                max="100"
                value="0"
              />
            </div>

            <div class="control-group-4">
              <div>
                <label for="whiteBalance" class="slider-label"
                  >White Balance:
                  <span id="whiteBalanceValue" class="value">0</span>
                </label>
                <input
                  type="range"
                  id="whiteBalance"
                  min="-100"
                  max="100"
                  value="0"
                />
              </div>
              <div>
                <label for="tint" class="slider-label"
                  >Tint:
                  <span id="tintValue" class="value">0</span>
                </label>
                <input type="range" id="tint" min="-100" max="100" value="0" />
              </div>
            </div>
          </div>

          <div class="control-group-5">
            <button id="toggleAdvancedButton" class="color-class" disabled>
              More
            </button>
            <button
              onclick="processImage()"
              id="applyButton"
              class="efek-class"
              disabled
            >
              Reload
            </button>
            <button id="downloadButton" class="download-class" disabled>
              Simpan
            </button>
          </div>
          <div id="outputInfo" class="info"></div>
        </div>
      </div>
    </div>

    <canvas id="tempCanvas" class="hidden"></canvas>
    <canvas id="finalCanvas" class="hidden"></canvas>

    <script src="y-2.js"></script>
  </body>
</html>
